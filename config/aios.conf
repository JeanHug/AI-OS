# config/aios.conf — source unique des valeurs de AI OS.
# Sourcé par scripts/lib-common.sh. Modifier une valeur ici la change partout.

# ---------------------------------------------------------------------------
# Image Ubuntu de base (cloud image officielle)
# ---------------------------------------------------------------------------
AIOS_UBUNTU_BASE="https://cloud-images.ubuntu.com/releases/stonking/release"
AIOS_UBUNTU_IMAGE="ubuntu-26.10-server-cloudimg-amd64.img"

# ---------------------------------------------------------------------------
# Noyau mainline installé dans la VM
# ---------------------------------------------------------------------------
AIOS_KERNEL_ABBREV="7.3.1"
AIOS_KERNEL_VERSION="7.3.1-070301"
AIOS_KERNEL_BUILD="202610301300"

# ---------------------------------------------------------------------------
# Instance cloud-init
# ---------------------------------------------------------------------------
# Le cloud-init est volontairement minime (utilisateur, clé SSH, règle polkit,
# noyau verrouillé par marqueur) : sa ré-exécution coûte quelques secondes.
# Les paquets du bureau et des outils d'interaction sont gérés par l'étape
# explicite « install-desktop » du workflow, pas par cloud-init.
AIOS_INSTANCE_ID="aios-qemu-durable"

# ---------------------------------------------------------------------------
# Taille du disque invité
# ---------------------------------------------------------------------------
AIOS_DISK_SIZE="16G"

# ---------------------------------------------------------------------------
# Résolution de l'affichage invité (Xvfb)
# ---------------------------------------------------------------------------
AIOS_GUEST_RESOLUTION="1280x720x24"

# ---------------------------------------------------------------------------
# Durées du cycle (secondes, à partir du moment où la VM est prête)
# ---------------------------------------------------------------------------
# Phase de production (période d'utilisation) avant déclenchement du suivant.
AIOS_PRODUCE_SECONDS=18000
# Chevauchement après déclenchement : le successeur restaure pendant que
# l'ancien continue de servir, puis s'auto-arrête.
AIOS_OVERLAP_SECONDS=1800

# Garde-fou espace disque avant sauvegarde (en ko) : 3,5 Go de marge.
AIOS_MIN_FREE_KB=3670016

# Budget total du job (la limite dure du runner est de 6 h).
AIOS_JOB_BUDGET_SECONDS=21600

# ---------------------------------------------------------------------------
# Tunnel durable Cloudflare (nommé « ai-os », créé via l'API Cloudflare)
# ---------------------------------------------------------------------------
# Le connecteur cloudflared se lance avec un jeton récupéré via CLOUDFLARE_TOKEN
# (GET /accounts/{CLOUDFLARE_ID}/cfd_tunnel/{AIOS_TUNNEL_ID}/token). L'entrée
# ingress du tunnel pointe en permanence vers le pont d'interaction :3001 et le
# Worker « ai-os-desk » y accède par liaison VPC — l'URL publique est fixe.
AIOS_TUNNEL_ID="b4098ed4-3cdc-4719-8466-6f65e0ef0564"
AIOS_TUNNEL_NAME="ai-os"
AIOS_DESK_URL="https://ai-os-desk.hugdu77777.workers.dev"
