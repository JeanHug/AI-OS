# config/aios.conf — source unique des valeurs de AI OS.
# Sourcé par scripts/lib-common.sh. Modifier une valeur ici la change partout.
# Aucune de ces valeurs ne doit être recopiée dans un script.

# ---------------------------------------------------------------------------
# Image Ubuntu de base (cloud image officielle)
# ---------------------------------------------------------------------------
AIOS_UBUNTU_BASE="https://cloud-images.ubuntu.com/releases/stonking/release"
AIOS_UBUNTU_IMAGE="ubuntu-26.10-server-cloudimg-amd64.img"

# ---------------------------------------------------------------------------
# Noyau principalline installé dans la VM
# ---------------------------------------------------------------------------
AIOS_KERNEL_ABBREV="7.3.1"
AIOS_KERNEL_VERSION="7.3.1-070301"
AIOS_KERNEL_BUILD="202610301300"

# ---------------------------------------------------------------------------
# Instance cloud-init
# ---------------------------------------------------------------------------
# cloud-init ré-exécute ses modules « par instance » quand cet identifiant
# change. C'est LE mécanisme de convergence des checkpoints : pour ajouter des
# paquets à une VM déjà sauvegardée, ajoutez-les dans lib-common.sh
# (aios_guest_packages) puis changez la valeur ci-dessous (…-durable-2, etc.).
# Les modules sont idempotents (le noyau est verrouillé par un marqueur) :
# une ré-exécution n'installe jamais le noyau deux fois et ne redémarre pas.
# Chaque script de démarrage utilise sa propre valeur.
AIOS_INSTANCE_ID_DURABLE="aios-qemu-durable"
AIOS_INSTANCE_ID_LIVE="aios-qemu-live"
AIOS_INSTANCE_ID_VALIDATION="aios-qemu-validation"

# ---------------------------------------------------------------------------
# Taille du disque invité
# ---------------------------------------------------------------------------
AIOS_DISK_SIZE="16G"

# ---------------------------------------------------------------------------
# Résolution de l'affichage invité (Xvfb)
# ---------------------------------------------------------------------------
AIOS_GUEST_RESOLUTION="1280x720x24"
