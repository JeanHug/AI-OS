<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI OS</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #ffffff;
      color: #111827;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-font-smoothing: antialiased;
    }
    main {
      width: 280px;
      text-align: center;
      animation: fade .5s ease;
    }
    @keyframes fade { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

    .orb {
      width: 64px; height: 64px;
      margin: 0 auto 22px;
      border-radius: 50%;
      background: radial-gradient(circle at 32% 30%, #60a5fa, #2563eb 62%, #1d4ed8);
      box-shadow: 0 10px 30px rgba(37, 99, 235, .28), inset 0 1px 2px rgba(255,255,255,.5);
    }
    .orb.ok { animation: pulse .7s ease; }
    @keyframes pulse { 50% { transform: scale(1.12); box-shadow: 0 14px 40px rgba(37,99,235,.42); } }

    h1 {
      font-size: 21px;
      font-weight: 650;
      letter-spacing: -0.02em;
      margin-bottom: 26px;
    }

    input {
      width: 100%;
      height: 50px;
      border: 1px solid #e5e7eb;
      border-radius: 13px;
      background: #f9fafb;
      font-size: 19px;
      letter-spacing: .18em;
      text-align: center;
      color: #111827;
      outline: none;
      transition: border-color .15s, box-shadow .15s, background .15s;
    }
    input:focus {
      border-color: #2563eb;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, .12);
    }
    input::placeholder { letter-spacing: .06em; color: #9ca3af; font-size: 15px; }

    button {
      width: 100%;
      height: 50px;
      margin-top: 12px;
      border: 0;
      border-radius: 13px;
      background: #111827;
      color: #fff;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: background .15s, transform .05s;
    }
    button:hover { background: #1f2937; }
    button:active { transform: scale(.985); }
    button:disabled { background: #9ca3af; cursor: default; }

    .msg {
      height: 20px;
      margin-top: 16px;
      font-size: 13px;
      color: #dc2626;
    }
    .shake { animation: shake .4s ease; }
    @keyframes shake {
      20% { transform: translateX(-7px); } 40% { transform: translateX(6px); }
      60% { transform: translateX(-4px); } 80% { transform: translateX(2px); }
    }
  </style>
</head>
<body>
  <main id="panel">
    <div class="orb" id="orb"></div>
    <h1>AI OS</h1>
    <form id="form" autocomplete="off">
      <input id="code" type="password" inputmode="numeric" maxlength="8"
             placeholder="Code d'accès" autocomplete="off" autofocus>
      <button type="submit" id="go">Ouvrir le bureau</button>
    </form>
    <p class="msg" id="msg"></p>
  </main>

  <script>
    'use strict';
    const GRANT_URL = 'https://ai-os.hugdu77777.workers.dev/grant';
    const form = document.getElementById('form');
    const code = document.getElementById('code');
    const go = document.getElementById('go');
    const msg = document.getElementById('msg');
    const orb = document.getElementById('orb');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const value = code.value.trim();
      if (!value) { shake('Entrez votre code.'); return; }
      go.disabled = true;
      go.textContent = '…';
      msg.textContent = '';
      try {
        const r = await fetch(GRANT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ password: value }),
        });
        if (!r.ok) {
          shake(r.status === 401 ? 'Code incorrect.' : 'Service indisponible, réessayez.');
          return;
        }
        const j = await r.json();
        if (!j || !j.url) { shake('Service indisponible, réessayez.'); return; }
        orb.classList.add('ok');
        go.textContent = 'Ouverture…';
        setTimeout(() => { window.location.href = j.url; }, 250);
      } catch (err) {
        shake('Connexion impossible.');
      }
    });

    function shake(text) {
      msg.textContent = text;
      go.disabled = false;
      go.textContent = 'Ouvrir le bureau';
      code.classList.remove('shake');
      void code.offsetWidth;
      code.classList.add('shake');
      code.focus();
    }
  </script>
</body>
</html>
