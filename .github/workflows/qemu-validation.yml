name: AI OS QEMU - validation experimentale
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Installer QEMU et outils cloud-init
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 qemu-utils cloud-image-utils openssh-client curl
      - name: Demarrer et verifier la VM
        run: bash scripts/qemu-validation.sh
